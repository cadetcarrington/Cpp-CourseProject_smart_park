name: macOS and server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 镜像 2026-11-02 退役，基线换 macos-15；
        # macos-26 / xcode-27（macOS 27，preview）覆盖新系统与 Xcode 27 工具链。
        include:
          - os: macos-15
            macos_admin: 'ON'
          - os: macos-26
            macos_admin: 'ON'
          - os: xcode-27
            macos_admin: 'ON'
          - os: ubuntu-24.04
            macos_admin: 'OFF'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qthttpserver qtwebsockets'
          cache: true

      - name: Configure current applications
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          -DSMARTPARK_BUILD_MACOS_ADMIN=${{ matrix.macos_admin }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/ci --parallel 4

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --timeout 240

      # 一次性侦察步骤：把 macOS 27 SDK 里 AppKit 的新 API 头文件打进构建
      # 日志，供本机（SDK 26.2）开发 macOS 27 适配时查阅精确签名。
      - name: Dump macOS 27 AppKit headers
        if: matrix.os == 'xcode-27'
        run: |
          SDK=$(xcrun --show-sdk-path)
          H="$SDK/System/Library/Frameworks/AppKit.framework/Headers"
          echo "== NSRefreshController.h =="
          cat "$H/NSRefreshController.h" 2>/dev/null || echo MISSING
          echo "== NSScrollView refreshController =="
          grep -n -B3 -A6 "refreshController" "$H/NSScrollView.h" || true
          echo "== NSGlassEffectView.h (27 changes?) =="
          cat "$H/NSGlassEffectView.h" 2>/dev/null || true
          echo "== All API_AVAILABLE(macos(27..)) in AppKit =="
          grep -rn "API_AVAILABLE(macos(27" "$H" | head -80 || true

      # 在 macos-26 上顺手产出 DMG 工件，验证打包链路在新系统上的可用性。
      - name: Package DMG
        if: matrix.os == 'macos-26'
        env:
          BUILD_DIR: ${{ github.workspace }}/build/ci
          SKIP_BUILD: '1'
          RUN_SMOKE: '0'
        run: scripts/package-macos.sh

      - name: Upload DMG
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: SmartParkAdmin-macOS-26
          path: build/pack/*.dmg
          if-no-files-found: error
