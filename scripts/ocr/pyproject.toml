[project]
name = "smartpark-ocr"
version = "0.1.0"
description = "SmartPark 车牌识别环境（PP-OCRv5/paddlepaddle CPU + OpenCV/PaddleOCR 工具链，uv 管理）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddlepaddle==3.3.1",
    "opencv-python==5.0.0.93",
    "numpy==2.5.3",
    "pillow>=12",
    "pyyaml>=6",
    "shapely>=2.1",
    "pyclipper>=1.4",
    "scikit-image>=0.25",
    "tqdm>=4.7",
    "lmdb>=2.3",
    "albumentations>=2.0",
    "requests>=2.34",
    "protobuf>=7.3",
]
